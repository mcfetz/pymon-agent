name: Build (PR-Check)

# Nur noch ein Bau-Check fuer Pull Requests. Gebaut und deployt wird seit 22.11.2026 in Gitea
# (.gitea/workflows/docker.yml): Image in die eigene Registry, dann Stack-Update per
# deploy/deploy.py. Kein ghcr-Push und kein Portainer-Service-Webhook mehr von hier.
#
# amd64-only und ohne QEMU: die Agenten werden mit dem Install-Befehl des Servers als
# Python-Skript aufgesetzt, das Image braucht nur der Swarm-Dienst.

on:
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (ohne Push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: pymon-agent:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
